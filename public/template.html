<script>var payload = $$replace
    var iconAssets = (payload && payload.iconAssets) ? payload.iconAssets : {}
    var data = (payload && payload.data) ? payload.data : payload

    const template =({tab,speaker,displayMode,iconUrl,borderColor,textColor,placeholderChar,iconDisplayStyle,message,bubbleBgColor,bubbleArrowColor,showSeparator}) => { 
    const resolvedIconUrl = (iconUrl && iconAssets && iconAssets[iconUrl]) ? iconAssets[iconUrl] : (iconUrl || '')
    return `<div class="message-item export log-item" data-tab="${tab}" data-speaker="${speaker}" data-display-mode="${displayMode}">
        <div class="message-container export">
            <div class="icon-container export" style="width:64px; height:64px;">
                <img src="${resolvedIconUrl}" alt="${speaker} (default)" class="icon export"
                    style="border-color: ${borderColor}; display: block;"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <span class="icon-placeholder export"
                    style="display: ${iconDisplayStyle}; border-color: ${borderColor}; line-height: 58px; font-size: 32px;">
                    ${placeholderChar}
                </span>
                <span class="speaker-name-below-icon export" style="color: {{textColor}};">${speaker}</span>
            </div>
            <div class="content-container export">
                <span class="speaker-name-default export" style="color: {{textColor}};">
                    ${speaker} <span class="original-tab export">[${tab}]</span>
                </span>
                <span class="tab-name-below-icon export">[${tab}]</span>
                <div class="bubble export bubble-left"
                    style="--bubble-bg-color: ${bubbleBgColor}; --bubble-arrow-color: ${bubbleArrowColor}; color: ${textColor};">
                    ${message}
                </div>
            </div>
        </div>
        <div class="narration-container export" style="color: {{textColor}};">
            <span class="narration-tab">[${tab}]</span>
            <span class="narration-speaker">${speaker}:</span>
            <span class="narration-message">${message}</span>
        </div>
    </div>`
    }

    const container = document.getElementById('export-log-display')
    const content = document.getElementById('virtual-list-content')
    const phantom = document.getElementById('virtual-list-phantom')
    const searchInput = document.getElementById('export-search-input');
    const searchButton = document.getElementById('export-search-button');
    const nextButton = document.getElementById('export-next-button');
    const searchCountDisplay = document.getElementById('search-count-display');

    // 虚拟列表配置（使用默认预估高度，仅用于初始化缓存）
    const DEFAULT_ITEM_HEIGHT = 100; 
    
    // 全局数据状态
    let filteredData = data.sort((a, b) => a.time - b.time); 
    let activeTab='all',activePlayer='all';

    // 搜索状态
    let searchResults = []; 
    let currentMatchIndex = -1; 
    let currentSearchTerm = ''; 
    
    // 关键缓存：存储每项的实际高度和累计偏移量
    // 长度与 filteredData 相同，初始化为预估高度
    let itemHeights = new Array(filteredData.length).fill(DEFAULT_ITEM_HEIGHT); 
    let offsetCache = []; 
    
    // 用于标记是否正在执行搜索跳转，防止滚动事件干扰
    let isJumping = false;


    // --- 辅助函数 ---

    /**
     * 更新搜索计数显示
     */
    function updateSearchCountDisplay() {
        if (searchResults.length > 0) {
            searchCountDisplay.textContent = `${currentMatchIndex + 1} / ${searchResults.length}`;
            nextButton.disabled = false;
        } else if (currentSearchTerm) {
            searchCountDisplay.textContent = '未找到';
            nextButton.disabled = true;
        } else {
            searchCountDisplay.textContent = '';
            nextButton.disabled = true;
        }
    }

    /**
     * 更新高度缓存和偏移缓存
     */
    function updateCaches() {
        offsetCache = [];
        let totalHeight = 0;
        
        // 1. 遍历并计算所有项的累计偏移量
        for (let i = 0; i < filteredData.length; i++) {
            offsetCache[i] = totalHeight;
            totalHeight += itemHeights[i];
        }

        // 2. 遍历当前渲染的 DOM 元素，获取实际高度并校正缓存
        const items = content.children;
        for (let i = 0; i < items.length; i++) {
            const globalIndex = startIndex + i;
            if (globalIndex < filteredData.length) {
                // offsetHeight 包含 padding 和 border，我们需要加上 margin-bottom
                const actualHeight = items[i].offsetHeight + 16; 
                if (actualHeight > 0) {
                   itemHeights[globalIndex] = actualHeight;
                }
            }
        }
        
        // 3. 重新计算总高度并更新 phantom 高度
        totalHeight = itemHeights.reduce((sum, height) => sum + height, 0);
        phantom.style.height = `${totalHeight}px`;

        // 4. 重新计算偏移缓存 (因为 itemHeights 可能更新了)
        let currentOffset = 0;
        for (let i = 0; i < filteredData.length; i++) {
            offsetCache[i] = currentOffset;
            currentOffset += itemHeights[i];
        }
    }
    
    /**
     * 根据偏移量（滚动位置）使用二分查找法查找起始索引
     * @param {number} offset - 滚动位置
     */
    function findStartIndexByOffset(offset) {
        let low = 0;
        let high = offsetCache.length - 1;
        let index = 0;

        while (low <= high) {
            const mid = Math.floor((low + high) / 2);
            if (offsetCache[mid] <= offset) {
                index = mid;
                low = mid + 1;
            } else {
                high = mid - 1;
            }
        }
        return index;
    }


    // --- 核心逻辑函数 ---

    /**
     * 虚拟列表渲染函数 (动态高度)
     */
    function virtualRender() {
        // 在跳转过程中忽略滚动事件，避免多次触发导致的性能问题
        if (isJumping) return;
        
        const scrollTop = container.scrollTop;
        const containerHeight = container.clientHeight;

        // 1. 更新缓存 (这会精确校准滚动条总高度)
        updateCaches(); 

        // 2. 计算起始索引 (使用精确偏移缓存查找)
        // 向上查找，确保有缓冲
        const BUFFER_PX = containerHeight / 2;
        startIndex = findStartIndexByOffset(Math.max(0, scrollTop - BUFFER_PX)); 

        // 3. 计算结束索引 (找到最后一个可见项+缓冲)
        let visibleEndOffset = scrollTop + containerHeight + BUFFER_PX;
        
        // 找到第一个偏移量大于可见区域末尾的索引
        endIndex = findStartIndexByOffset(visibleEndOffset) + 1;
        endIndex = Math.min(filteredData.length, endIndex);
        
        // 4. 计算内容区域偏移量
        const offset = offsetCache[startIndex] || 0;

        // 5. 更新内容区域定位和渲染内容
        content.style.transform = `translateY(${offset}px)`;
        
        let html = '';
        const currentBatch = filteredData.slice(startIndex, endIndex);

        currentBatch.forEach((v, localIndex) => {
            const globalIndex = startIndex + localIndex;
            
            const isHighlighted = searchResults[currentMatchIndex] === globalIndex;
            const highlightClass = isHighlighted ? ' highlight' : '';
            
            let itemHTML = template(v);
            itemHTML = itemHTML.replace('<div class="message-item export log-item', `<div class="message-item export log-item${highlightClass}"`);
            html += itemHTML;
        });

        content.innerHTML = html;
    }

    /**
     * 主渲染函数：用于筛选/切换条件时调用
     */
    function render() {
        // 0. 筛选数据
        filteredData = data.filter(v => {
            const tabMatch = activeTab === 'all' || v.tab === activeTab
            const playerMatch = activePlayer === 'all' || v.speaker === activePlayer
            return tabMatch && playerMatch
        }).sort((a, b) => a.time - b.time)

        // 重置高度缓存，对应新的数据长度
        itemHeights = new Array(filteredData.length).fill(DEFAULT_ITEM_HEIGHT);

        // 1. 滚动条归零
        container.scrollTop = 0;
        isJumping = false;

        // 重置搜索状态（因为数据变了，之前的搜索结果索引失效）
        searchResults = [];
        currentMatchIndex = -1;
        updateSearchCountDisplay();

        // 2. 重新执行虚拟渲染以显示初始视图
        virtualRender();
    }
    
    /**
     * 初始化搜索，找到所有匹配项并跳转到第一个
     */
    function searchAndJump() {
        const searchTerm = searchInput.value.trim();
        
        if (searchTerm === currentSearchTerm && searchTerm) {
            jumpToNextMatch();
            return;
        }

        currentSearchTerm = searchTerm;
        searchResults = [];
        currentMatchIndex = -1;
        
        if (!searchTerm) {
            updateSearchCountDisplay();
            virtualRender(); // 清除高亮
            return;
        }

        const keyword = searchTerm.toLowerCase();

        // 1. 遍历完整数据，找到所有匹配项的全局索引
        filteredData.forEach((item, index) => {
            if (item.message && item.message.toLowerCase().includes(keyword)) {
                searchResults.push(index);
            }
        });
        
        // 2. 处理结果
        if (searchResults.length > 0) {
            currentMatchIndex = 0; // 从第一个结果开始
            jumpToMatch(searchResults[currentMatchIndex]);
        } else {
            updateSearchCountDisplay();
            virtualRender(); 
        }
    }
    
    /**
     * 跳转到指定的全局索引，使用平滑滚动
     * @param {number} globalIndex 
     */
    function jumpToMatch(globalIndex) {
        if (globalIndex < 0 || globalIndex >= filteredData.length) return;
        
        // 1. 计算目标滚动位置 (使用精确偏移缓存)
        // 注意：这里我们使用缓存，所以必须确保缓存是最新的。
        updateCaches(); 
        const scrollTopPosition = offsetCache[globalIndex];

        // 2. 标记正在跳转
        isJumping = true;
        
        // 3. 滚动容器 (自动滑动)
        container.scrollTo({
            top: scrollTopPosition,
            behavior: 'smooth'
        });

        // 4. 清除跳转标记，并强制更新渲染，确保目标元素高亮
        setTimeout(() => {
            isJumping = false;
            // 滚动停止后，virtualRender 会确保目标元素在 DOM 中
            virtualRender();
        }, 300); // 假设 300ms 足够完成平滑滚动，或者在更复杂的场景中，应该监听 'scrollend' 事件。

        // 5. 更新显示
        updateSearchCountDisplay();
    }


    /**
     * 跳转到下一个匹配项
     */
    function jumpToNextMatch() {
        if (searchResults.length === 0) return;

        // 循环到第一个
        currentMatchIndex = (currentMatchIndex + 1) % searchResults.length;
        
        jumpToMatch(searchResults[currentMatchIndex]);
    }
    
    // --- 事件绑定 ---

    const tabs = document.querySelector('#export-log-tabs')
    const selector = document.querySelector('#export-speaker-filter')
    
    // 初始化选项卡和发言人
    const tabSet = new Set();
    const selectPlayers = new Set();
    data.forEach(v => {
        tabSet.add(v.tab)
        selectPlayers.add(v.speaker)
    })
    
    tabs.innerHTML = `<button data-tab="all" class="tab-button export active">[all]</button>`+Array.from(tabSet).map(v => `<button data-tab="${v}" class="tab-button export">[${v}]</button>`).join("")
    selector.innerHTML = `<option value="all">全部发言人</option>`+Array.from(selectPlayers)
    .map(v => `<option value="${v}">${v}</option>`).join('')

    tabs.onclick = (e) => {
        if (!e.target.dataset.tab) return;
        [...tabs.children].forEach(v => v.classList.remove('active'))
        e.target.classList.add('active')
        activeTab = e.target.dataset.tab
        render() 
    } 
    
    selector.onchange = (e) => {
        activePlayer = e.target.value
        render() 
    }

    searchButton.onclick = searchAndJump;
    nextButton.onclick = jumpToNextMatch;

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            searchAndJump();
        }
    });

    // 关键：滚动事件触发虚拟渲染和高度更新
    container.addEventListener('scroll', virtualRender);

    // 页面加载完成后执行首次渲染
    updateCaches(); // 确保初始缓存和 phantom 高度设置正确
    virtualRender(); 
</script>

</html>
